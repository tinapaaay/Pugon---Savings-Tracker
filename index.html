<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pugo is a savings pet game. Save money to feed and grow your quail.">
  <title>Pugo | Save to grow your quail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app">
    <div class="corners" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>

    <header class="top-bar">
      <h1 class="logo">Pugo</h1>

      <div class="stat" aria-label="Total saved">
        <span class="stat-label">Saved</span>
        <strong class="stat-value" id="total-saved">₱0</strong>
      </div>

      <button class="icon-button" id="mute-button" type="button" aria-pressed="false" aria-label="Mute sounds">
        <svg class="icon icon-sound" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" />
          <path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" />
        </svg>
        <svg class="icon icon-muted" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" />
          <path class="wave" d="M17 9l5 6M22 9l-5 6" />
        </svg>
      </button>
    </header>

    <main class="stage">
      <div class="yard">
        <canvas id="yard-canvas" width="1024" height="765" role="img" aria-label="Pugo's backyard"></canvas>
        <p class="hint" id="hint"></p>
        <div class="floaters" id="floaters" aria-hidden="true"></div>
      </div>

      <button class="save-button" id="save-button" type="button">
        <span aria-hidden="true">+</span> Add savings
      </button>

      <p class="sr-only" id="announcer" aria-live="polite"></p>
    </main>

    <footer class="footer">
      <button class="text-button" id="reset-button" type="button">Start over</button>
    </footer>
  </div>

  <dialog id="save-dialog" aria-labelledby="save-dialog-title">
    <form id="save-form" novalidate>
      <h2 id="save-dialog-title">How much did you save?</h2>

      <label for="amount-input">Amount (₱)</label>
      <input id="amount-input" name="amount" type="number" inputmode="decimal" min="1" step="any" placeholder="100" autocomplete="off">
      <p class="error" id="amount-error" role="alert"></p>

      <div class="quick-amounts" aria-label="Quick amounts">
        <button type="button" data-amount="20">₱20</button>
        <button type="button" data-amount="50">₱50</button>
        <button type="button" data-amount="100">₱100</button>
        <button type="button" data-amount="500">₱500</button>
      </div>

      <div class="dialog-actions">
        <button class="text-button" type="button" id="cancel-save">Cancel</button>
        <button class="primary-button" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
